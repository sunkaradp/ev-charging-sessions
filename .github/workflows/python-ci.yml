name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-test.txt
      - name: Compile Python source
        run: python -m compileall -q batch_airflow tests
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: pytest -q
